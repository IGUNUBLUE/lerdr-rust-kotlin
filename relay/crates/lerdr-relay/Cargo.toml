[package]
name = "lerdr-relay"
version = "0.0.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lerdr relay binary: axum /ws endpoint, herdr-e2ee-v2 handshake driver, per-client session actors."

[dependencies]
lerdr-core = { path = "../lerdr-core" }
lerdr-e2ee = { path = "../lerdr-e2ee" }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] } # TaskTracker for the server lifecycle
tracing = { workspace = true }
p256 = { workspace = true }
base64 = { workspace = true }
rand = "0.9"         # OsRng: handshake ephemeral keys + nonces, device-id minting
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3" # StreamExt/SinkExt split for the axum WebSocket

zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29" # real-socket WS client for the end-to-end test (same tungstenite axum uses)
tempfile = "3"
lerdr-fixture = { path = "../lerdr-fixture" }
hex = { workspace = true }
rstest = { workspace = true }
sha2 = { workspace = true }
