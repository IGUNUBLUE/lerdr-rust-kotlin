[package]
name = "lerdr-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lerdr wire semantics: protocol v3 DTOs, pane delta codec, client send buffer, pane-size lease arbitration."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
