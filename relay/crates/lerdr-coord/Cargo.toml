[package]
name = "lerdr-coord"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lerdr coordinator: Herdr topology projection, per-pane watch tasks, and the ActionRouter implementation that drives the relay."

[dependencies]
lerdr-core = { path = "../lerdr-core" }
lerdr-e2ee = { path = "../lerdr-e2ee" }     # bootstrap: invitation auth selectors
lerdr-herdr = { path = "../lerdr-herdr" }
lerdr-relay = { path = "../lerdr-relay" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# lerdr-relay binary (src/bin/lerdr-relay) — CLI/config/bootstrap deps.
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14", default-features = false }
gethostname = "0.5"
rand = "0.9"
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rstest = { workspace = true }
tempfile = "3"
lerdr-fixture = { path = "../lerdr-fixture" }
lerdr-relay = { path = "../lerdr-relay", features = [] }
