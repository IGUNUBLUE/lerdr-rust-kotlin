[package]
name = "lerdr-coord"
version = "0.0.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lerdr coordinator: Herdr topology projection, per-pane watch tasks, and the ActionRouter implementation that drives the relay."

[dependencies]
lerdr-core = { path = "../lerdr-core" }
lerdr-e2ee = { path = "../lerdr-e2ee" }     # bootstrap: invitation auth selectors
lerdr-herdr = { path = "../lerdr-herdr" }
lerdr-relay = { path = "../lerdr-relay" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
p256 = { workspace = true }   # VAPID ES256 + RFC 8291 ECDH (ecdh/ecdsa/pem/pkcs8 via defaults+workspace)
aes-gcm = { workspace = true } # aes128gcm content coding
hkdf = { workspace = true }   # RFC 8291/8188 key derivation
reqwest = { workspace = true } # push delivery POSTs (rustls-only, no redirects)

# lerdr-relay binary (src/bin/lerdr-relay) — CLI/config/bootstrap deps.
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14", default-features = false }
gethostname = "0.5"
# update-worker: flock(2) on update.lock + killpg TERM/KILL for timed-out
# installs (the oracle's syscall.Flock / syscall.Kill(-pgid, …)).
libc = "0.2"
rand = "0.9"
url = "2"
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rstest = { workspace = true }
tempfile = "3"
lerdr-fixture = { path = "../lerdr-fixture" }
lerdr-relay = { path = "../lerdr-relay", features = [] }
