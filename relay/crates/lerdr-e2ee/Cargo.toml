[package]
name = "lerdr-e2ee"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
description = "herdr-e2ee-v2 wire crypto: P-256 ECDH, HKDF-SHA256, AES-256-GCM frames."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
p256 = { version = "0.14", features = ["ecdh"] }
aes-gcm = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
aes = { version = "0.9", features = ["zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"

[dev-dependencies]
lerdr-fixture = { path = "../lerdr-fixture" }
hex = "0.4"
proptest = "1.11"
