name: Fixture check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Envelope/schema validation only — the Rust and Kotlin harnesses that
  # consume these fixtures run under relay.yml and app.yml (which also gate
  # on fixtures/** changes). Keeping this workflow to the fast schema pass
  # avoids running the same cargo/gradle suites twice per PR.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture suite envelopes
        run: python3 tools/validate_fixtures.py fixtures
